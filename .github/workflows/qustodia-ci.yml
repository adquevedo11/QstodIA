name: QustodIA CI

on:
  push:
    branches:
      - "qustodia/**"
  pull_request:
    branches:
      - "qustodia/**"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check (QustodIA modules)
        run: |
          ruff check --config ruff.toml \
            dojo/security_concept/ \
            dojo/executive_report/ \
            dojo/pentest/ \
            dojo/hour_pool/ \
            dojo/go_live_readiness/ \
            dojo/sqa_metrics/

  test:
    name: Model & API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: defectdojo
          POSTGRES_PASSWORD: defectdojo
          POSTGRES_DB: defectdojo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DD_DATABASE_URL: "postgresql://defectdojo:defectdojo@localhost:5432/defectdojo"
      DD_SECRET_KEY: "ci-test-secret-key-not-for-production"
      DD_ALLOWED_HOSTS: "localhost"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --settings=dojo.settings.settings

      - name: Run QustodIA unit tests
        run: |
          python manage.py test unittests.test_qustodia_models \
            --settings=dojo.settings.settings \
            --verbosity=2

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build QustodIA Django image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.django-alpine
          push: false
          tags: qustodia/defectdojo-django:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
