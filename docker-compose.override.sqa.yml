# docker-compose.override.sqa.yml
#
# Protege el diseño corporativo SQA SA / VMaaS 2.0 ante actualizaciones de DefectDojo.
#
# Uso:
#   docker-compose -f docker-compose.yml -f docker-compose.override.sqa.yml up -d
#
# Para hacer permanente sin especificar el archivo cada vez,
# renómbralo a docker-compose.override.yml (Docker Compose lo carga automáticamente).
#
# Tras actualizar código Python (models, views, urls) debes reiniciar uwsgi:
#   docker-compose restart uwsgi
#
# Tras agregar migraciones nuevas:
#   docker-compose exec uwsgi python manage.py migrate
---
services:

  # nginx sirve los archivos estáticos (CSS, imágenes)
  nginx:
    depends_on:
      uwsgi:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://localhost:8080/ | grep -qE '^(200|301|302|401|403)$'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - default
      - sqasa
    volumes:
      - defectdojo_media:/usr/share/nginx/html/media
      # CSS personalizado SQA
      - type: bind
        source: ./dojo/static/dojo/css/sqa-theme.css
        target: /usr/share/nginx/html/static/dojo/css/sqa-theme.css
        read_only: true
      - type: bind
        source: ./dojo/static/dojo/css/dojo.css
        target: /usr/share/nginx/html/static/dojo/css/dojo.css
        read_only: true
      # Imágenes corporativas SQA
      - type: bind
        source: ./dojo/static/dojo/img/logo.png
        target: /usr/share/nginx/html/static/dojo/img/logo.png
        read_only: true
      - type: bind
        source: ./dojo/static/dojo/img/qustodIA_logo.png
        target: /usr/share/nginx/html/static/dojo/img/qustodIA_logo.png
        read_only: true
      - type: bind
        source: ./dojo/static/dojo/img/chop.png
        target: /usr/share/nginx/html/static/dojo/img/chop.png
        read_only: true
      - type: bind
        source: ./dojo/static/dojo/img/favicon.png
        target: /usr/share/nginx/html/static/dojo/img/favicon.png
        read_only: true

  # uwsgi sirve los templates y el código Python
  uwsgi:
    environment:
      GOLIVE_AGENT_URL: "http://go-live-agent:8001"
      DD_CREATE_CLOUD_BANNER: "False"
      # ── Correo / SMTP ────────────────────────────────────────────────────
      DD_EMAIL_URL: "smtp+tls://adquevedo11%40gmail.com:zpwrpfmgjtpqrcum@smtp.gmail.com:587"
      DD_DEFAULT_FROM_EMAIL: "adquevedo11@gmail.com"
    networks:
      - default
      - sqasa
    volumes:
      - type: bind
        source: ./docker/extra_settings
        target: /app/docker/extra_settings
      - "defectdojo_media:${DD_MEDIA_ROOT:-/app/media}"

      # ── Código Python principal modificado ──────────────────────────────
      - type: bind
        source: ./dojo/models.py
        target: /app/dojo/models.py
        read_only: true
      - type: bind
        source: ./dojo/urls.py
        target: /app/dojo/urls.py
        read_only: true
      - type: bind
        source: ./dojo/engagement/views.py
        target: /app/dojo/engagement/views.py
        read_only: true

      # ── Módulo Concepto de Seguridad ─────────────────────────────────────
      - type: bind
        source: ./dojo/security_concept
        target: /app/dojo/security_concept
        read_only: true

      # ── Módulo Métricas SQA ───────────────────────────────────────────────
      - type: bind
        source: ./dojo/sqa_metrics
        target: /app/dojo/sqa_metrics
        read_only: true

      # ── Módulo Informe Ejecutivo ──────────────────────────────────────────
      - type: bind
        source: ./dojo/executive_report
        target: /app/dojo/executive_report
        read_only: true

      # ── Módulo Go-Live Readiness ──────────────────────────────────────────
      - type: bind
        source: ./dojo/go_live_readiness
        target: /app/dojo/go_live_readiness
        read_only: true

      # ── Migración SecurityConcept ────────────────────────────────────────
      - type: bind
        source: ./dojo/db_migrations/0249_securityconcept.py
        target: /app/dojo/db_migrations/0249_securityconcept.py
        read_only: true

      # ── Migración ExecutiveReport ────────────────────────────────────────
      - type: bind
        source: ./dojo/db_migrations/0250_executivereport.py
        target: /app/dojo/db_migrations/0250_executivereport.py
        read_only: true

      # ── Migración Pentest ─────────────────────────────────────────────────
      - type: bind
        source: ./dojo/db_migrations/0251_pentest.py
        target: /app/dojo/db_migrations/0251_pentest.py
        read_only: true

      # ── Migración HourPool ───────────────────────────────────────────────
      - type: bind
        source: ./dojo/db_migrations/0252_hourpool.py
        target: /app/dojo/db_migrations/0252_hourpool.py
        read_only: true

      # ── Migración PentestProject industry ───────────────────────────────
